[package]
name = "paloma"
description = "A UI framework for command-line programs: prompts, flows, messages, spinners and progress bars."
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
keywords = ["cli", "terminal", "ui", "prompt", "progress"]
categories = ["command-line-interface"]
license = "MIT"
homepage = "https://github.com/mvilark/paloma"
repository = "https://github.com/mvilark/paloma"
documentation = "https://docs.rs/paloma"
readme = "README.md"

[features]
default = ["editor", "password"]
editor = ["tempfile"]
fuzzy-select = ["fuzzy-matcher"]
history = []
password = ["zeroize"]
completion = []

[dependencies]
console = "0.16.0"
tempfile = { version = "3", optional = true }
zeroize = { version = "1.1.1", optional = true }
fuzzy-matcher = { version = "0.3.7", optional = true }
shell-words = "1.1.0"

# A key read with a timeout, for background checks (`change_delay`). Both are already in
# every build through `console`; on other targets background checks are disabled.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
ctrlc = "3"
# The Lull example.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sunrise = "3"

[[example]]
name = "ultraviolet"
path = "examples/ultraviolet/main.rs"
required-features = ["fuzzy-select", "password"]
# Run its unit tests with `cargo test`, not only with `--example ultraviolet`.
test = true

[[example]]
name = "loam"
path = "examples/loam/main.rs"
required-features = ["fuzzy-select", "password", "history", "completion", "editor"]
# Run its unit tests with `cargo test`, not only with `--example loam`.
test = true

[[example]]
name = "lull"
path = "examples/lull/main.rs"
required-features = ["fuzzy-select"]
# Run its unit tests with `cargo test`, not only with `--example lull`.
test = true

[[example]]
name = "password"
required-features = ["password"]

[[example]]
name = "flow"
required-features = ["password"]

[[example]]
name = "prompt_messages"
required-features = ["password"]

[[example]]
name = "editor"
required-features = ["editor"]

[[example]]
name = "fuzzy_select"
required-features = ["fuzzy-select"]

[[example]]
name = "history"
required-features = ["history"]

[[example]]
name = "history_custom"
required-features = ["history"]

[[example]]
name = "completion"
required-features = ["completion"]

[workspace.metadata.workspaces]
no_individual_tags = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "console", "console::*",
]
